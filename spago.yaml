package:
  name: catenable-lists
  description: Strict catenable list implementation for PureScript.
  build:
    strict: true
    pedanticPackages: true
  publish:
    version: 7.0.1
    license: BSD-3-Clause
    location:
      githubOwner: purescript
      githubRepo: purescript-catenable-lists
  dependencies:
    - control: ">=6.0.0 <7.0.0"
    - foldable-traversable: ">=6.0.0 <7.0.0"
    - lists: ">=7.0.0 <8.0.0"
    - maybe: ">=6.0.0 <7.0.0"
    - prelude: ">=6.0.0 <7.0.0"
    - tuples: ">=7.0.0 <8.0.0"
    - unfoldable: ">=6.0.0 <7.0.0"
  test:
    main: Test.Main
    strict: true
    pedanticPackages: true
    dependencies:
      - assert: ">=6.0.0 <7.0.0"
      - console: ">=6.0.0 <7.0.0"
      - effect: ">=4.0.0 <5.0.0"
      - newtype: ">=5.0.0 <6.0.0"
      - partial: ">=4.0.0 <5.0.0"
workspace: {}
